# Total professional experience is computed, never stated: `start` to today,
# minus every excluded interval. Quoted so YAML keeps them as strings rather
# than parsing them into timezone-shifted dates.
timeline:
  start: "2016-06-01"
  excluded:
    # The service record behind this interval, as the SDM application's
    # employment history lists it; it is not a Work Experience entry.
    - label: Military Service
      start: "2017-01-01"
      end: "2017-06-30"
      organization: Taiwanese Armed Forces
      location: "Kinmen, Taiwan"
      title: Private
      dates: "Jan 2017 – Jun 2017"
      details:
        - text: "Compulsory Military Service"
        - text: "Participated in the pre-Han Kuang Exercise as a reserve artillery member"
    # Feb – May 2022 was Servicetech work between Shopee and Boston
    # University, so the gap starts in June.
    - label: Career Gap
      start: "2022-06-01"
      end: "2024-01-31"
