# `credential`, `issued`, and `cohort` are as LinkedIn lists them. `courses`
# are as each program's page listed them when Ken's cohort ran.
certifications:
  - school: Massachusetts Institute of Technology
    degree: "Certificate in Data Science and Machine Learning"
    dates: "Aug 2023 – Nov 2023"
    # Earlier resumes print it in this short form, ranking included.
    alias: "Cert. in Data Science & Machine Learning (top 15 of 146)"
    location: "Cambridge, MA, USA"
    arrangement: Remote
    cohort: "12-Week Cohort"
    issued: "Nov 2023"
    credential: "ZVQDBZIK"
    rank: "15th of 146 participants"
    score: "579.5 / 600"
    # Earlier resumes also list Predictive Analytics, Computer Vision, and
    # Supervised & Unsupervised Learning. The program covers all 3, as a
    # project area, a Deep Learning topic, and techniques across courses, but
    # none is a course title.
    courses:
      - Python for Data Science
      - Statistics for Data Science
      - Making Sense of Unstructured Data
      - Regression and Prediction
      - Classification and Hypothesis Testing
      - Deep Learning
      - Recommendation Systems
      - Networking and Graphical Models
  - school: New York University
    degree: "Certificate, Preparatory Course for Graduate Studies in Computing"
