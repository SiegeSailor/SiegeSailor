# The resume's Work Experience section, and the company behind the home page
# hero (the site reads the first entry's `company` and `website`).
#
# Stacked role lines are deliberate: background-check vendors verify titles and
# dates separately, so CooperSurgical and Servicetech keep one line per title
# rather than one widened range. Some material here is held back for the
# one-page fit; StageSource and DY Game are held back because they belong
# under a degree rather than in an employment history, and each says so where
# it sits.
experience:
  - company: CooperSurgical
    location: "NJ / MA / CT, USA"
    industry: Medical Device
    website: "https://www.coopersurgical.com/"
    blurb:
      text: "Medical device R&D — global IVF device leader operating in 130+ countries"
    roles:
      - title: Senior Software Engineer
        dates: "Jun 2025 – Present"
        location: "NJ, USA"
      - title: Software Engineer
        dates: "Jan 2024 – May 2025"
        location: "MA, USA"
      - title: Software Engineering Intern
        dates: "May 2023 – Aug 2023"
        location: "CT, USA"
    bullets:
      - text: >-
          Architected a cross-product device SDK shipped as a Docker
          container (gRPC, MongoDB, RabbitMQ, Zeroconf) with .NET, Node.js,
          Python, and C++ clients, reused across 5+ FDA / EU MDR-regulated
          IVF products
      - text: >-
          Cut RFID data-transition time by 90% with database caching and gRPC
          streaming, reducing environmental-data rendering time on device UIs
          by 50%
      - text: >-
          Led a shared React.js component library and its automated quality
          workflow (ESLint, Jest, Semantic Release on GitLab CI) serving 5+
          vendors and 20+ developers
      - text: >-
          Built secure IVF workstation software on purpose-built embedded
          Linux — compliance-driven SDLC (IEC 62304 / ISO 13485), GitLab
          CI/CD pipelines, and containerized applications
      - text: >-
          Integrated LLM-assisted engineering into R&D workflows: agentic
          coding tools, self-healing document generation in GitLab CI,
          knowledge-graph extraction, and LLM observability (Langfuse)
      - text: >-
          Developed a containerized Protocol Buffers compiler service
          automating multi-language client generation, plus NuGet network
          connectivity libraries and CLI tooling adopted org-wide
      - text: >-
          Partnered with electrical, mechanical, and firmware teams to define
          cross-functional interface standards, shaping next-generation IVF
          device architecture and the R&D roadmap for the coming year
      - text: >-
          Coordinated 3+ global formative studies per year across divergent
          development schedules — identified system bottlenecks, set
          achievable milestones, and established a continuous R&D–clinical
          feedback loop
      - text: >-
          Piloted workplace–device–cloud network communication with
          cross-country teams and architected hybrid cloud / on-site services
          (AWS, Wind River Studio) meeting data-integrity and retention
          regulations at no-internet clinical sites

