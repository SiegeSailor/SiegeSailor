  - organization: National Formosa University Multimedia Design Volleyball Team
    role: Team Leader
    dates: "Sep 2014 – Jun 2016"
    details:
      - text: "led the team to its first-ever championship"
      - text: >-
          initiated weekly exercises with professional coaches for non-student
          athlete members, organized morning drills and a winter break camp,
          and arranged 4+ competitions per year with other departments
