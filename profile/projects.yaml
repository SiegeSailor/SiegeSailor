# `stage` is one of Planning | Development | Production.
projects:
  - title: Jin Yu Zhang's Website
    stage: Production
    href: "https://github.com/SiegeSailor/Website"
    # Starts with the first published article, which predates the repository.
    dates: "Sep 2019 – Present"
    description: >-
      This site — a statically exported *Next.js* application served from *AWS
      S3* behind *CloudFront*, with markdown-driven posts, in-site search, and a
      single-source résumé build system. Built with *TailwindCSS*, *HeroUI*, the
      *UnifiedJS* ecosystem, *Mermaid*, and *Zustand*.
  - title: Terminal Sigma
    stage: Production
    href: "https://github.com/SiegeSailor/Terminal-Sigma"
    dates: "Apr 2026 – Present"
    description: >-
      Available on `npm` and as a desktop app, a *TypeScript* terminal
      dashboard that gives game-style feedback on self-development: a
      pixel-art character levels up alongside a Pomodoro timer, diet and
      workout trackers, and everyday quotes, in English and Traditional
      Chinese. Built with *React*, *Ink*, *Zod*, *Electron*, and *xterm.js*.
  - title: Smarty Notebook Collection
    stage: Production
    href: "https://github.com/SiegeSailor/Smarty-Notebook-Collection"
    dates: "Sep 2025 – Apr 2026"
    description: >-
      A collection of self-contained *Jupyter* notebooks that run batch
      requests against the **Smarty** Cloud API, such as fetching U.S. ZIP+4
      codes by address. Built with *Python*, *pandas*, *Requests*, and
      *Poetry*.
  - title: Cryptography CLI
    stage: Development
    href: "https://github.com/SiegeSailor/Cryptography"
    dates: "Dec 2022 – Present"
    description: >-
      Available on `npm`, a *TypeScript* package with *WebAssembly* enabled
      that provides a collection of cryptography functions and a command-line
      tool with interactive prompts to demonstrate key encryption flows and
      algorithms.
  - title: Concurrency Toolkit
    stage: Planning
    href: "https://github.com/SiegeSailor"
    description: >-
      Available on `pip`, a *Python* concurrent class wrapper for managing
      multiple tasks with error handling and logging. Based on `asyncio`. This
      is a go-to solution for simplified asynchronous programming with
      easy-to-use abstractions.
    details:
      - text: >-
          A Python PIP library comes up with a wrapper class for concurrent
          tasks to abstract in a waterfall manner, built on Async.io
  - title: Account Management CBWMs
    stage: Planning
    href: "https://github.com/SiegeSailor/OpenSource.AccountHub"
    description: >-
      Scalable *OWASP*-Complied Cloud-Based Microservice that allows users to
      manage their accounts and settings. It provides an event-driven
      architecture comes with a eventual consistency model and various
      communication protocols for different use cases and CBWMs.
    details:
      - text: >-
          A Java project that provides RESTful endpoints for an account
          database system within the OWASP SAMM framework, built with Java,
          Spring MVC, and MySQL
  - title: Configurable Bucket CBWM Boilerplate
    stage: Planning
    href: "https://github.com/SiegeSailor/OpenSource.Bucket"
    description: >-
      A project boilerplate that provides a *RESTful* interface for *AWS S3*
      using *Flask*. Following the microservices principle, this project has
      been wrapped with *Docker*, *LocalStack*, and *Terraform* to isolate the
      running/deploying environments with a fully configurable layer that
      supports development on local laptops, testing in *GitHub Actions* CI/CD
      pipelines, and deployment to *AWS*.
    details:
      - text: >-
          A Python scaffold that furnishes a file storage cloud-based service
          with AWS S3, AWS CloudWatch, Terraform, LocalStack, and GitHub
          Actions, and utilizes the Account Management CBWMs
  - title: Deployable UI Library Boilerplate
    stage: Planning
    href: "https://github.com/SiegeSailor"
    description: >-
      Quick start for deploying *React* components on `npm`. A project
      boilerplate that provides a set of team-oriented development tools, such
      as *GitLab CI/CD*, *Semantic Release*, *TypeScript*, *Jest*, *ESLint*,
      *Stylelint*, and *Ladle*, and best practices.
