# `stage` is one of Planning | Development | Production.
# Only projects with a released version on GitHub belong here.
projects:
  - title: Jin Yu Zhang's Website
    stage: Production
    href: "https://github.com/SiegeSailor/website"
    # Starts with the first published article, which predates the repository.
    dates: "Sep 2019 – Present"
    description: >-
      This site — a statically exported *Next.js* application served from *AWS
      S3* behind *CloudFront*, with markdown-driven posts, in-site search, and a
      single-source résumé build system. Built with *TailwindCSS*, *HeroUI*, the
      *UnifiedJS* ecosystem, *Mermaid*, and *Zustand*.
  - title: Terminal Sigma
    stage: Production
    href: "https://github.com/SiegeSailor/terminal-sigma"
    dates: "Apr 2026 – Oct 2026"
    description: >-
      Available on `npm` and as a desktop app, a *TypeScript* terminal
      dashboard that gives game-style feedback on self-development: a
      pixel-art character levels up alongside a Pomodoro timer, diet and
      workout trackers, and everyday quotes, in English and Traditional
      Chinese. Built with *React*, *Ink*, *Zod*, *Electron*, and *xterm.js*.
  - title: Smarty Notebook Collection
    stage: Production
    href: "https://github.com/SiegeSailor/notebook-smarty"
    dates: "Sep 2025 – Apr 2026"
    description: >-
      A collection of self-contained *Jupyter* notebooks that run batch
      requests against the **Smarty** Cloud API, such as fetching U.S. ZIP+4
      codes by address. Built with *Python*, *pandas*, *Requests*, and
      *Poetry*.
  - title: Bulls and Cows Bot
    stage: Production
    href: "https://github.com/SiegeSailor/game-bulls-and-cows"
    dates: "May 2021"
    description: >-
      A chat bot that plays Bulls and Cows, the number-guessing game, with
      `set`, `guess`, `status`, `clear`, and `help` commands and replies in
      Traditional Chinese, built for *Azure App Service* and **Skype**. Built
      with *Node.js* and the **Microsoft Bot Framework** SDK.
  - title: Cryptography CLI
    stage: Development
    href: "https://github.com/SiegeSailor/library-cryptography"
    dates: "Dec 2022 – Present"
    description: >-
      Available on `npm`, a *TypeScript* package with *WebAssembly* enabled
      that provides a collection of cryptography functions and a command-line
      tool with interactive prompts to demonstrate key encryption flows and
      algorithms.
